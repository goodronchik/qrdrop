name: Сборка QRDrop (Android, Windows, macOS, Linux)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Подготовка проекта и Android-платформы
        run: |
          python3 - << 'EOF'
          import pathlib, shutil, zipfile
          root = pathlib.Path(".")
          if not (root / "pubspec.yaml").exists():
              for z in root.glob("*.zip"):
                  with zipfile.ZipFile(z) as zf:
                      zf.extractall(root)
          if not (root / "pubspec.yaml").exists():
              found = next(root.rglob("pubspec.yaml"), None)
              if not found:
                  raise SystemExit("ОШИБКА: pubspec.yaml не найден! Загрузите qrdrop_flutter_project.zip на вкладку Code.")
              src = found.parent
              shutil.copy2(src / "pubspec.yaml", root / "pubspec.yaml")
              if (root / "lib").exists():
                  shutil.rmtree(root / "lib")
              shutil.copytree(src / "lib", root / "lib")
          EOF
          cp -r lib /tmp/qrdrop_lib
          cp pubspec.yaml /tmp/qrdrop_pubspec.yaml
          flutter create --platforms=android --project-name qrdrop --org com.qrdrop .
          rm -rf lib && mv /tmp/qrdrop_lib lib
          mv /tmp/qrdrop_pubspec.yaml pubspec.yaml
          python3 - << 'EOF'
          p = "android/app/src/main/AndroidManifest.xml"
          txt = open(p, encoding="utf-8").read()
          perms = (
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n'
          )
          if "android.permission.INTERNET" not in txt:
              txt = txt.replace("<application", perms + "    <application", 1)
          if "usesCleartextTraffic" not in txt:
              txt = txt.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          open(p, "w", encoding="utf-8").write(txt)
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: QRDrop-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Подготовка проекта и Windows-платформы
        shell: pwsh
        run: |
          if (-not (Test-Path pubspec.yaml)) {
            $zip = Get-ChildItem -Filter *.zip | Select-Object -First 1
            if ($zip) { Expand-Archive -Path $zip.FullName -DestinationPath . -Force }
          }
          if (-not (Test-Path pubspec.yaml)) {
            $found = Get-ChildItem -Recurse -Filter pubspec.yaml | Select-Object -First 1
            if (-not $found) { throw "ОШИБКА: pubspec.yaml не найден! Загрузите qrdrop_flutter_project.zip на вкладку Code." }
            Copy-Item $found.FullName .\pubspec.yaml -Force
            Copy-Item -Recurse (Join-Path $found.DirectoryName lib) .\lib -Force
          }
          Copy-Item -Recurse lib $env:TEMP\qrdrop_lib -Force
          Copy-Item pubspec.yaml $env:TEMP\qrdrop_pubspec.yaml -Force
          flutter create --platforms=windows --project-name qrdrop --org com.qrdrop .
          Remove-Item -Recurse -Force lib
          Move-Item $env:TEMP\qrdrop_lib lib
          Move-Item -Force $env:TEMP\qrdrop_pubspec.yaml pubspec.yaml
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Упаковка в ZIP
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath QRDrop-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QRDrop-Windows-x64
          path: QRDrop-Windows-x64.zip

  build-macos:
    name: macOS (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Подготовка проекта и macOS-платформы
        run: |
          python3 - << 'EOF'
          import pathlib, shutil, zipfile
          root = pathlib.Path(".")
          if not (root / "pubspec.yaml").exists():
              for z in root.glob("*.zip"):
                  with zipfile.ZipFile(z) as zf:
                      zf.extractall(root)
          if not (root / "pubspec.yaml").exists():
              found = next(root.rglob("pubspec.yaml"), None)
              if not found:
                  raise SystemExit("ОШИБКА: pubspec.yaml не найден! Загрузите qrdrop_flutter_project.zip на вкладку Code.")
              src = found.parent
              shutil.copy2(src / "pubspec.yaml", root / "pubspec.yaml")
              if (root / "lib").exists():
                  shutil.rmtree(root / "lib")
              shutil.copytree(src / "lib", root / "lib")
          EOF
          cp -r lib /tmp/qrdrop_lib
          cp pubspec.yaml /tmp/qrdrop_pubspec.yaml
          flutter create --platforms=macos --project-name qrdrop --org com.qrdrop .
          rm -rf lib && mv /tmp/qrdrop_lib lib
          mv /tmp/qrdrop_pubspec.yaml pubspec.yaml
          python3 - << 'EOF'
          entitlements = """\t<key>com.apple.security.network.server</key>
          \t<true/>
          \t<key>com.apple.security.network.client</key>
          \t<true/>
          \t<key>com.apple.security.files.user-selected.read-write</key>
          \t<true/>
          """
          for p in ("macos/Runner/Release.entitlements", "macos/Runner/DebugProfile.entitlements"):
              txt = open(p, encoding="utf-8").read()
              if "com.apple.security.network.server" not in txt:
                  txt = txt.replace("</dict>", entitlements + "</dict>", 1)
                  open(p, "w", encoding="utf-8").write(txt)
          EOF
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Упаковка .app в ZIP
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/QRDrop-macOS.zip" qrdrop.app
      - uses: actions/upload-artifact@v4
        with:
          name: QRDrop-macOS
          path: QRDrop-macOS.zip

  build-linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установка системных библиотек GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Подготовка проекта и Linux-платформы
        run: |
          python3 - << 'EOF'
          import pathlib, shutil, zipfile
          root = pathlib.Path(".")
          if not (root / "pubspec.yaml").exists():
              for z in root.glob("*.zip"):
                  with zipfile.ZipFile(z) as zf:
                      zf.extractall(root)
          if not (root / "pubspec.yaml").exists():
              found = next(root.rglob("pubspec.yaml"), None)
              if not found:
                  raise SystemExit("ОШИБКА: pubspec.yaml не найден! Загрузите qrdrop_flutter_project.zip на вкладку Code.")
              src = found.parent
              shutil.copy2(src / "pubspec.yaml", root / "pubspec.yaml")
              if (root / "lib").exists():
                  shutil.rmtree(root / "lib")
              shutil.copytree(src / "lib", root / "lib")
          EOF
          cp -r lib /tmp/qrdrop_lib
          cp pubspec.yaml /tmp/qrdrop_pubspec.yaml
          flutter create --platforms=linux --project-name qrdrop --org com.qrdrop .
          rm -rf lib && mv /tmp/qrdrop_lib lib
          mv /tmp/qrdrop_pubspec.yaml pubspec.yaml
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Упаковка в tar.gz
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/QRDrop-Linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: QRDrop-Linux-x64
          path: QRDrop-Linux-x64.tar.gz
